<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="style.css">
<title>CV Analysis Results</title>
</head>
<body>

  <p>Your AI-powered CV evaluation</p>
</div>

<div class="nav">
  <div class="nav-links">

    <a href="jobs.html">Find Jobs</a>
    <a href="history.html">History</a>
  </div>
</div>

  <div class="card">

    <div style="text-align: center; margin-top: 30px;">
